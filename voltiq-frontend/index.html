                        "paper-margin": "#e8b0b0",

                        "user-bubble": "#fce481",

<style>
        body {
            background-color: #f9f7f1;
            background-image: 
                linear-gradient(90deg, transparent 78px, #e8b0b0 78px, #e8b0b0 80px, transparent 80px),
                linear-gradient(transparent 27px, #e0e8e4 27px, #e0e8e4 28px, transparent 28px);
            background-size: 100% 28px;
            font-family: 'JetBrains Mono', Courier, monospace;
            line-height: 28px;
            color: #2d2926;
        }
        
        /* Typography overrides to align with paper lines */
        p, h1, h2, h3, div, span, td, th {
            font-family: 'JetBrains Mono', Courier, monospace;
            line-height: 28px !important;
        }

        .header-title {
            font-family: 'Zilla Slab', serif;
        }

        .ai-message-card {
            border-top: 4px solid #0f4c3a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .user-message-card {
            box-shadow: 2px 4px 8px rgba(0,0,0,0.15);
        }
